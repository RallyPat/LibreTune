# cargo-audit / rustsec configuration (project-local)
# Prefer fixing or upgrading; only ignore with a tracked reason.
# Entries whose crate has left Cargo.lock or whose advisory was withdrawn
# are dead weight: remove them (issue #365).

[advisories]
ignore = [
    # proc-macro-error 1.x — unmaintained (transitive, e.g. via tauri build scripts)
    "RUSTSEC-2024-0370",
    # glib <0.20.0 — VariantStrIter unsoundness (transitive via gtk-rs 0.18 Linux webkit stack)
    "RUSTSEC-2024-0429",
    # quick-xml <0.41.0 — quadratic duplicate-attribute check (transitive, 0.38.4 in lock)
    "RUSTSEC-2026-0194",
    # quick-xml <0.41.0 — unbounded namespace-declaration allocation in NsReader (transitive)
    "RUSTSEC-2026-0195",
    # crossbeam-epoch <0.9.20 — invalid pointer deref in fmt::Pointer impl (transitive)
    "RUSTSEC-2026-0204",
]
