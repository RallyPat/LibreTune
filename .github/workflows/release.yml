name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag_name: ${{ steps.get_version.outputs.VERSION || 'manual' }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version from tag
        id: get_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-rust
        with:
          cache_key: release-linux

      - uses: ./.github/actions/setup-linux-deps

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/libretune-app
        run: npm ci

      - name: Build Tauri app (Linux)
        working-directory: crates/libretune-app
        run: npx tauri build --target x86_64-unknown-linux-gnu

      - uses: ./.github/actions/collect-tauri-artifacts
        with:
          platform: linux
          dest: crates/libretune-app/artifacts/linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-x86_64
          path: crates/libretune-app/artifacts/linux/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-rust
        with:
          cache_key: release-windows

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/libretune-app
        run: npm ci

      - name: Build Tauri app (Windows)
        working-directory: crates/libretune-app
        run: npx tauri build --target x86_64-pc-windows-msvc

      - uses: ./.github/actions/collect-tauri-artifacts
        with:
          platform: windows
          dest: crates/libretune-app/artifacts/windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-x86_64
          path: crates/libretune-app/artifacts/windows/*
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-rust
        with:
          cache_key: release-macos

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/libretune-app
        run: npm ci

      - name: Add Rust targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Build Tauri app (macOS ARM)
        working-directory: crates/libretune-app
        run: npx tauri build --target aarch64-apple-darwin

      - name: Build Tauri app (macOS Intel)
        working-directory: crates/libretune-app
        run: npx tauri build --target x86_64-apple-darwin

      - uses: ./.github/actions/collect-tauri-artifacts
        with:
          platform: macos
          dest: crates/libretune-app/artifacts/macos

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-universal
          path: crates/libretune-app/artifacts/macos/*
          if-no-files-found: error
          retention-days: 30

  upload-release:
    name: Upload Release Assets
    needs: [create-release, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: false

      - name: Get tag name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release (only for tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/linux-x86_64/**/*
            artifacts/windows-x86_64/**/*
            artifacts/macos-universal/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (manual build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: artifacts/**
          if-no-files-found: error
          retention-days: 7
