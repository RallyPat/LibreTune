name: Nightly Build

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check-changes:
    name: Check for Recent Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      date_stamp: ${{ steps.date.outputs.date }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Get date stamp
        id: date
        run: echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Check for commits in last 24 hours
        id: check
        run: |
          COMMIT_COUNT=$(git log --since="24 hours ago" --oneline | wc -l)
          if [ "$COMMIT_COUNT" -gt 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Found $COMMIT_COUNT commits in last 24 hours (or manual trigger)"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No commits in last 24 hours, skipping nightly build"
          fi

  test:
    name: Gate (Linux)
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache_key: nightly-gate

      - uses: ./.github/actions/setup-linux-deps

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Frontend type check
        working-directory: crates/libretune-app
        run: |
          npm ci
          npx tsc --noEmit

  build-linux:
    name: Build Linux
    needs: [check-changes, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-rust
        with:
          cache_key: nightly-linux

      - uses: ./.github/actions/setup-linux-deps

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/libretune-app
        run: npm ci

      - name: Stamp nightly version
        working-directory: crates/libretune-app/src-tauri
        run: |
          DATE_STAMP=${{ needs.check-changes.outputs.date_stamp }}
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"0.1.0-nightly.${DATE_STAMP}\"/" tauri.conf.json
          echo "Version stamped as 0.1.0-nightly.${DATE_STAMP}"

      - name: Build Tauri app (Linux)
        working-directory: crates/libretune-app
        run: npx tauri build --target x86_64-unknown-linux-gnu

      - uses: ./.github/actions/collect-tauri-artifacts
        with:
          platform: linux
          dest: crates/libretune-app/artifacts/linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-x86_64-${{ needs.check-changes.outputs.date_stamp }}
          path: crates/libretune-app/artifacts/linux/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows
    needs: [check-changes, test]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-rust
        with:
          cache_key: nightly-windows

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/libretune-app
        run: npm ci

      - name: Build Tauri app (Windows - Portable)
        working-directory: crates/libretune-app
        run: npx tauri build --target x86_64-pc-windows-msvc --no-bundle

      - uses: ./.github/actions/collect-tauri-artifacts
        with:
          platform: windows
          dest: crates/libretune-app/artifacts/windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-x86_64-${{ needs.check-changes.outputs.date_stamp }}
          path: crates/libretune-app/artifacts/windows/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS
    needs: [check-changes, test]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup-rust
        with:
          cache_key: nightly-macos

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/libretune-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/libretune-app
        run: npm ci

      - name: Stamp nightly version
        working-directory: crates/libretune-app/src-tauri
        run: |
          DATE_STAMP=${{ needs.check-changes.outputs.date_stamp }}
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"0.1.0-nightly.${DATE_STAMP}\"/" tauri.conf.json
          echo "Version stamped as 0.1.0-nightly.${DATE_STAMP}"

      - name: Add Rust targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Build Tauri app (macOS ARM)
        working-directory: crates/libretune-app
        run: npx tauri build --target aarch64-apple-darwin

      - name: Build Tauri app (macOS Intel)
        working-directory: crates/libretune-app
        run: npx tauri build --target x86_64-apple-darwin

      - uses: ./.github/actions/collect-tauri-artifacts
        with:
          platform: macos
          dest: crates/libretune-app/artifacts/macos

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-aarch64-x86_64-${{ needs.check-changes.outputs.date_stamp }}
          path: crates/libretune-app/artifacts/macos/*
          if-no-files-found: error
          retention-days: 7

  upload-nightly:
    name: Upload Nightly Release
    needs: [check-changes, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: false

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          DATE_STAMP="${{ needs.check-changes.outputs.date_stamp }}"

          for f in artifacts/linux-x86_64-*/*.AppImage; do
            [ -f "$f" ] && cp "$f" "release/LibreTune-nightly-${DATE_STAMP}-linux-x86_64.AppImage"
          done
          for f in artifacts/linux-x86_64-*/*.deb; do
            [ -f "$f" ] && cp "$f" "release/LibreTune-nightly-${DATE_STAMP}-linux-x86_64.deb"
          done
          for f in artifacts/linux-x86_64-*/*.rpm; do
            [ -f "$f" ] && cp "$f" "release/LibreTune-nightly-${DATE_STAMP}-linux-x86_64.rpm"
          done
          for f in artifacts/windows-x86_64-*/*.exe; do
            [ -f "$f" ] && cp "$f" "release/LibreTune-nightly-${DATE_STAMP}-windows-x86_64-portable.exe"
          done
          for f in artifacts/macos-aarch64-x86_64-*/*.dmg; do
            [ -f "$f" ] && cp "$f" "release/$(basename "$f" .dmg)-nightly-${DATE_STAMP}.dmg"
          done
          for f in artifacts/macos-aarch64-x86_64-*/*.zip; do
            [ -f "$f" ] && cp "$f" "release/$(basename "$f" .zip)-nightly-${DATE_STAMP}.zip"
          done

          echo "=== Release files ==="
          ls -lh release/
          if [ -z "$(ls -A release)" ]; then
            echo "ERROR: no release files prepared"
            exit 1
          fi

      - name: Create/Update Nightly Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            ## Nightly Build - ${{ needs.check-changes.outputs.date_stamp }}

            ⚠️ **This is an automated nightly build. Use at your own risk.**

            Built from commit: ${{ github.sha }}
            Build date: ${{ needs.check-changes.outputs.date_stamp }}

            ### Downloads
            - **Linux**: AppImage (portable), DEB, RPM
            - **Windows**: Portable EXE (no installation required)
            - **macOS**: separate DMGs per architecture — use `aarch64` for
              Apple Silicon (M1 and newer) and `x64` for Intel Macs. These are
              not universal binaries.

            ### macOS first launch
            These builds are ad-hoc signed but not notarized, so macOS will
            report the app as damaged or from an unidentified developer. Open
            **System Settings → Privacy & Security** and click **Open Anyway**,
            or run:
            ```
            xattr -dr com.apple.quarantine /Applications/LibreTune.app
            ```

            ### Notes
            - This release is automatically updated each night when there are new commits
            - For stable releases, see the [Releases](https://github.com/RallyPat/LibreTune/releases) page
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A red cron run notifies nobody by itself; file (at most) one open issue
  # pointing at the failed run.
  notify-failure:
    name: Open issue on failure
    needs: [check-changes, test, build-linux, build-windows, build-macos, upload-nightly]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open a nightly-failure issue unless one is already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_count="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'Nightly build failed in:title' --json number --jq length)"
          if [ "$open_count" -eq 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title 'Nightly build failed' \
              --body "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
